# ContributionSkyline Component Integration Guide

## Prerequisites

Your project must support:
- **shadcn/ui** project structure
- **Tailwind CSS**
- **TypeScript**

If your project doesn't have these, set them up:

```bash
# Initialize shadcn/ui (if not already set up)
npx shadcn@latest init --yes --defaults
```

## Component Location

**Default path:** `/components/ui`

**Why this folder is important:**
- Standard shadcn/ui convention for UI components
- Enables easy component discovery and reuse
- Follows ecosystem best practices
- Allows future shadcn CLI component additions
- Maintains consistency with the shadcn/ui ecosystem

If this folder doesn't exist, create it:
```bash
mkdir -p src/components/ui
```

## Component Files

### 1. Main Component
**File:** `src/components/ui/contribution-skyline.tsx`

Copy the complete component code (1392 lines) to this file.

### 2. Demo Component (Optional)
**File:** `src/components/demo.tsx`

```tsx
"use client"

import ContributionSkyline from "@/components/ui/contribution-skyline"

