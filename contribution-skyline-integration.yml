```

## Component Props

```typescript
export interface ContributionSkylineProps {
  /** One entry per day, `YYYY-MM-DD`. Repeated dates add up. Omit for a generated sample year. */
  data?: ContributionDay[]
  /** Last day shown. Defaults to the latest date in `data`, or today. */
  endDate?: string | Date
  /** Controlled view. */
  view?: View
  /** Uncontrolled starting view. The 3D view rises out of the flat one when it first scrolls into sight. */
  defaultView?: View
  onViewChange?: (view: View) => void
  /** A preset, four colours, or `{ light, dark }` sets of four. */
  palette?: PaletteInput
  /** Heading. Defaults to "{total} contributions in the last year". */
  title?: React.ReactNode
  /** Singular noun for a unit of activity. */
  unit?: string
  /** Plural noun. Defaults to `unit + "s"`. */
  unitPlural?: string
  /** Multiplies bar heights in 3D. */
  heightScale?: number
  /** Morph length, ms. */
  duration?: number
  /** 0 puts Sunday on the top row, 1 puts Monday there. */
  weekStart?: 0 | 1
  /** Drag to orbit in 3D. */
  orbit?: boolean
  showStats?: boolean
  showLegend?: boolean
  showToggle?: boolean
  /** Replaces the hint under the chart. `null` renders none. */
  footer?: React.ReactNode
  locale?: string
  /** Seed for the generated sample year. */
  seed?: number
  onCellClick?: (day: ContributionDay) => void
  className?: string
}
```

## Usage Examples

### Basic Usage
```tsx
import ContributionSkyline from "@/components/ui/contribution-skyline"

<ContributionSkyline endDate="2017-11-08" />
```

### With Custom Data
```tsx
import ContributionSkyline from "@/components/ui/contribution-skyline"

const myData = [
  { date: "2024-01-01", count: 5 },
  { date: "2024-01-02", count: 10 },
  { date: "2024-01-03", count: 3 },
  // ... more data
]

<ContributionSkyline data={myData} />
```

### With Custom Palette
```tsx
<ContributionSkyline
  palette="ocean"
  endDate="2024-12-31"
/>
```

### With Custom Styling
```tsx
<ContributionSkyline
  className="my-custom-class"
  palette="grape"
  heightScale={1.5}
  showStats={true}
  showLegend={true}
  orbit={true}
/>
```

### Controlled View
```tsx
const [view, setView] = useState<"2d" | "3d">("3d")

<ContributionSkyline
  view={view}
  onViewChange={setView}
/>
```

## Color Palettes

Built-in palettes:
- `github` - Classic GitHub green (default)
- `halloween` - Orange and brown
- `ocean` - Blue tones
- `ember` - Red and orange
- `grape` - Purple tones
- `mono` - Grayscale

Custom palette example:
```tsx
<ContributionSkyline
  palette={{
    light: ["#ff0000", "#ff6600", "#ffcc00", "#ff0000"],
    dark: ["#660000", "#993300", "#cc6600", "#ff3300"]
  }}
/>
```

## Features

### Interaction
- **Hover**: Shows tooltip with contribution count and date
- **Click**: Pins the selected day
- **Arrow Keys**: Navigate through the grid
- **Drag (3D mode)**: Orbit around the skyline
- **Double-click (3D mode)**: Reset camera to default position
- **Legend Hover**: Isolate specific activity levels

### Visual
- **Smooth Animations**: Morphing between 2D and 3D views
- **Responsive Layout**: Adapts to different screen sizes
- **Theme Support**: Automatically adapts to dark/light mode
- **Statistics**: Displays contribution totals, streaks, and busiest days

### Accessibility
- **ARIA Labels**: Full screen reader support
- **Keyboard Navigation**: Complete keyboard control
- **Focus Management**: Proper focus handling
- **Reduced Motion**: Respects `prefers-reduced-motion` preference

## Dependencies

**No external dependencies required** - the component uses only React.

Ensure your project has:
- React 18+
- TypeScript
- Tailwind CSS
- shadcn/ui setup (for CSS variables and theming)

## CSS Variables

The component uses these CSS custom properties (automatically set by shadcn/ui):
- `--color-background` - Background color
- `--color-foreground` - Text color
- `--color-border` - Border color
- `--color-muted-foreground` - Muted text color

## Component Notes

- **Client Component**: Uses `"use client"` directive (required for Canvas, ResizeObserver, IntersectionObserver)
- **No External Icons**: Uses inline SVG icons (GridIcon, CubeIcon)
- **No Images**: Pure Canvas rendering - no image assets needed
- **TypeScript**: Full TypeScript support with exported types
- **Browser Support**: Modern browsers with Canvas API support

## Exported Types

```typescript
export type ContributionDay = { date: string; count: number }
export type Cell = { date: string; count: number; level: number; week: number; day: number }
export type Streak = { days: number; start: string | null; end: string | null }
export type ContributionStats = {
  total: number
  first: string | null
  last: string | null
  busiest: { count: number; date: string | null }
  longest: Streak
  current: Streak
}
export type PaletteName = "github" | "halloween" | "ocean" | "ember" | "grape" | "mono"
export type PaletteInput = PaletteName | string[] | { light: string[]; dark: string[] }
```

## Helper Functions (Exported)

The component also exports several utility functions for advanced use:
- `generateContributions()` - Generate sample contribution data
- `buildGrid()` - Build the contribution grid from data
- `computeStats()` - Calculate statistics from cells
- `monthLabels()` - Generate month labels for the grid
- `dayMs()` - Convert date values to UTC timestamps
- `toKey()` - Convert timestamp to "YYYY-MM-DD" format
