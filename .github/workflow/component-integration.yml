## Component Features

### Interaction Features
- **Hover**: Shows tooltip with contribution count and date
- **Click**: Pins the selected day
- **Arrow Keys**: Navigate through the grid
- **Drag (3D mode)**: Orbit around the skyline
- **Double-click (3D mode)**: Reset camera to default position
- **Legend Hover**: Isolate specific activity levels

### Visual Features
- **Smooth Animations**: Morphing between 2D and 3D views
- **Responsive Layout**: Adapts to different screen sizes
- **Theme Support**: Automatically adapts to dark/light mode
- **Color Palettes**: 6 built-in palettes plus custom support
- **Statistics**: Displays contribution totals, streaks, and busiest days

### Accessibility
- **ARIA Labels**: Full screen reader support
- **Keyboard Navigation**: Complete keyboard control
- **Focus Management**: Proper focus handling
- **Reduced Motion**: Respects `prefers-reduced-motion` preference

## Customization

### Color Palettes
Built-in palettes:
- `github` - Classic GitHub green (default)
- `halloween` - Orange and brown
- `ocean` - Blue tones
- `ember` - Red and orange
- `grape` - Purple tones
- `mono` - Grayscale

Custom palette example:
```tsx
<ContributionSkyline
  palette={{
    light: ["#ff0000", "#ff6600", "#ffcc00", "#ff0000"],
    dark: ["#660000", "#993300", "#cc6600", "#ff3300"]
  }}
/>
```

### Custom Styling
The component uses CSS custom properties for theming:
- `--color-background` - Background color
- `--color-foreground` - Text color
- `--color-border` - Border color
- `--color-muted-foreground` - Muted text color

These are automatically set by shadcn/ui's theme system.

## Notes

### Why /components/ui Directory
The `/components/ui` directory is the standard convention for shadcn/ui components. This structure:
- Keeps UI components organized
- Allows for easy discovery and reuse
- Follows shadcn/ui best practices
- Enables easy component installation via shadcn CLI
- Maintains consistency with the ecosystem

### Component Requirements
- **Client Component**: Uses `"use client"` directive for browser APIs (Canvas, ResizeObserver, IntersectionObserver)
- **No External Icons**: Uses inline SVG icons (GridIcon, CubeIcon)
- **No Images**: Pure Canvas rendering - no image assets needed
- **TypeScript**: Full TypeScript support with exported types

### Browser Support
- Modern browsers with Canvas API support
- Requires ES6+ features (const, let, arrow functions, etc.)
- IntersectionObserver API (with polyfill fallback)
- ResizeObserver API

